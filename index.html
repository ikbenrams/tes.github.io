<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Persebaran Anggota Pak Wildan</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <h1>Location Explorer</h1>
        <p>Tes</p>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Our JavaScript -->
    <script>

        // Membuat peta
        const map = L.map('map').setView([-2.5, 118], 5);

        // Basemap OpenStreetMap
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        // Membaca file GeoJSON
        fetch('lokasi.geojson')
            .then(response => response.json())
            .then(data => {

                L.geoJSON(data, {

                    onEachFeature: function(feature, layer) {

                        const properties = feature.properties;

                        const popup = `
                            <div class="popup">
                                <h3>${properties.nama}</h3>
                                <p><strong>Provinsi:</strong> ${properties.provinsi}</p>
                                <p>${properties.keterangan}</p>
                                <p><strong>Kategori:</strong> ${properties.kategori}</p>
                            </div>
                        `;

                        layer.bindPopup(popup);
                    }

                }).addTo(map);

            })
            .catch(error => {
                console.error('GeoJSON gagal dimuat:', error);
            });

    </script>

</body>
</html>
