<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Indonesia Location Explorer</title>


    <!-- ==============================
         LEAFLET CSS
    =============================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- ==============================
         CUSTOM CSS
    =============================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==============================
         MAP
    =============================== -->

    <main id="map"></main>


    <!-- ==============================
         FLOATING INFO PANEL
    =============================== -->

    <aside class="info-panel">


        <!-- PROJECT LABEL -->

        <div class="project-label">

            <span class="project-dot"></span>

            GIS PORTFOLIO

        </div>


        <!-- TITLE -->

        <h1>

            Indonesia
            <br>

            <span>Location Explorer</span>

        </h1>


        <!-- DESCRIPTION -->

        <p class="description">

            An interactive web map showcasing
            selected locations across Indonesia.

        </p>


        <!-- DIVIDER -->

        <div class="panel-divider"></div>


        <!-- LOCATION HEADER -->

        <div class="location-heading">

            <span>SELECTED LOCATIONS</span>

            <span
                id="location-count"
                class="location-count"
            >
                0
            </span>

        </div>


        <!-- LOCATION LIST -->

        <div
            id="location-list"
            class="location-list"
        >

            <div class="loading">

                Loading locations...

            </div>

        </div>


        <!-- FOOTER -->

        <div class="panel-footer">

            <span>
                QGIS
            </span>

            <span>•</span>

            <span>
                GEOJSON
            </span>

            <span>•</span>

            <span>
                LEAFLET
            </span>

        </div>


    </aside>


    <!-- ==============================
         TOP RIGHT LABEL
    =============================== -->

    <div class="map-title">

        <span>WEB GIS</span>

        <strong>INDONESIA</strong>

    </div>


    <!-- ==============================
         LEAFLET JS
    =============================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>



    <script>


        /* =====================================================
           INITIALIZE MAP
        ===================================================== */

        const map = L.map(
            "map",
            {
                zoomControl: false
            }
        ).setView(
            [-2.5, 118],
            5
        );



        /* =====================================================
           ZOOM CONTROL
        ===================================================== */

        L.control.zoom(
            {
                position: "bottomright"
            }
        ).addTo(map);



        /* =====================================================
           OPENSTREETMAP BASEMAP
        ===================================================== */

        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
            }
        ).addTo(map);



        /* =====================================================
           CUSTOM MARKER ICON
        ===================================================== */

        const markerIcon = L.divIcon(
            {

                className: "custom-marker",

                html: `
                    <div class="marker-outer">
                        <div class="marker-inner"></div>
                    </div>
                `,

                iconSize: [
                    30,
                    30
                ],

                iconAnchor: [
                    15,
                    15
                ],

                popupAnchor: [
                    0,
                    -17
                ]

            }
        );



        /* =====================================================
           FIND QGIS FIELD
           Works with:
           nama
           Nama
           NAMA
           Nama_Lokasi
           etc.
        ===================================================== */

        function getField(
            properties,
            fieldName
        ) {

            if (
                !properties ||
                !fieldName
            ) {

                return "";

            }


            const target =
                fieldName
                    .toLowerCase()
                    .replace(
                        /[\s_-]/g,
                        ""
                    );


            const foundKey =
                Object.keys(
                    properties
                ).find(
                    key => {

                        const normalizedKey =
                            key
                                .toLowerCase()
                                .replace(
                                    /[\s_-]/g,
                                    ""
                                );

                        return (
                            normalizedKey ===
                            target
                        );

                    }
                );


            if (
                foundKey === undefined
            ) {

                return "";

            }


            return properties[
                foundKey
            ];

        }



        /* =====================================================
           LOAD GEOJSON
        ===================================================== */

        fetch(
            "lokasi.geojson"
        )

        .then(
            response => {

                if (
                    !response.ok
                ) {

                    throw new Error(
                        "lokasi.geojson tidak ditemukan."
                    );

                }


                return response.json();

            }
        )



        .then(
            data => {


                /* =================================================
                   CREATE GEOJSON LAYER
                ================================================= */

                const geojsonLayer =
                    L.geoJSON(
                        data,
                        {


                            /* =====================================
                               POINT MARKER
                            ===================================== */

                            pointToLayer:
                                function(
                                    feature,
                                    latlng
                                ) {

                                    return L.marker(
                                        latlng,
                                        {
                                            icon:
                                                markerIcon
                                        }
                                    );

                                },



                            /* =====================================
                               EACH FEATURE
                            ===================================== */

                            onEachFeature:
                                function(
                                    feature,
                                    layer
                                ) {


                                    const properties =
                                        feature.properties ||
                                        {};



                                    /* ==========================
                                       GET ATTRIBUTE DATA
                                    ========================== */

                                    const nama =
                                        getField(
                                            properties,
                                            "nama"
                                        ) ||
                                        "Unknown Location";


                                    const provinsi =
                                        getField(
                                            properties,
                                            "provinsi"
                                        ) ||
                                        "Indonesia";


                                    const keterangan =
                                        getField(
                                            properties,
                                            "keterangan"
                                        ) ||
                                        "No description available.";


                                    const kategori =
                                        getField(
                                            properties,
                                            "kategori"
                                        ) ||
                                        "LOCATION";



                                    /* ==========================
                                       POPUP
                                    ========================== */

                                    const popupHTML = `

                                        <div class="popup">

                                            <div class="popup-tag">

                                                ${kategori}

                                            </div>


                                            <h2>

                                                ${nama}

                                            </h2>


                                            <div class="popup-location">

                                                ${provinsi}

                                            </div>


                                            <div class="popup-line"></div>


                                            <p>

                                                ${keterangan}

                                            </p>

                                        </div>

                                    `;


                                    layer.bindPopup(
                                        popupHTML,
                                        {
                                            maxWidth: 280,
                                            className:
                                                "custom-popup"
                                        }
                                    );



                                    /* ==========================
                                       CREATE SIDEBAR ITEM
                                    ========================== */

                                    const list =
                                        document.getElementById(
                                            "location-list"
                                        );


                                    const index =
                                        list.querySelectorAll(
                                            ".location-item"
                                        ).length + 1;



                                    const item =
                                        document.createElement(
                                            "button"
                                        );


                                    item.className =
                                        "location-item";



                                    item.innerHTML = `

                                        <div class="location-left">

                                            <span
                                                class="location-index"
                                            >
                                                ${String(index).padStart(2, "0")}
                                            </span>


                                            <div class="location-text">

                                                <strong>

                                                    ${nama}

                                                </strong>


                                                <span>

                                                    ${provinsi}

                                                </span>

                                            </div>

                                        </div>


                                        <span class="location-arrow">

                                            ↗

                                        </span>

                                    `;



                                    /* ==========================
                                       SIDEBAR CLICK
                                    ========================== */

                                    item.addEventListener(
                                        "click",
                                        function() {


                                            const latlng =
                                                layer.getLatLng();


                                            map.flyTo(
                                                latlng,
                                                10,
                                                {
                                                    duration: 1.2
                                                }
                                            );


                                            setTimeout(
                                                function() {

                                                    layer.openPopup();

                                                },
                                                700
                                            );


                                        }
                                    );


                                    list.appendChild(
                                        item
                                    );

                                }

                        }
                    )
                    .addTo(map);



                /* =================================================
                   UPDATE LOCATION COUNT
                ================================================= */

                const total =
                    data.features
                        ? data.features.length
                        : 0;


                document.getElementById(
                    "location-count"
                ).textContent =
                    total;



                /* =================================================
                   REMOVE LOADING
                ================================================= */

                const loading =
                    document.querySelector(
                        ".loading"
                    );


                if (
                    loading
                ) {

                    loading.remove();

                }



                /* =================================================
                   FIT MAP TO LOCATIONS
                ================================================= */

                if (
                    geojsonLayer
                        .getBounds()
                        .isValid()
                ) {

                    map.fitBounds(
                        geojsonLayer.getBounds(),
                        {
                            padding: [
                                100,
                                100
                            ]
                        }
                    );

                }

            }
        )



        /* =====================================================
           ERROR HANDLING
        ===================================================== */

        .catch(
            error => {

                console.error(
                    error
                );


                document.getElementById(
                    "location-list"
                ).innerHTML = `

                    <div class="error">

                        <strong>
                            Map data unavailable.
                        </strong>


                        <p>

                            Make sure
                            <b>lokasi.geojson</b>
                            is in the same folder
                            as this HTML file.

                        </p>

                    </div>

                `;

            }
        );


    </script>


</body>

</html>
