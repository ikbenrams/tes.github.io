<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Indonesia Location Explorer</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- MAP -->
    <div id="map"></div>


    <!-- FLOATING SIDEBAR -->
    <aside class="sidebar">

        <div class="eyebrow">
            GIS PORTFOLIO
        </div>

        <h1>
            Indonesia
            <span>Location Explorer</span>
        </h1>

        <p class="description">
            Interactive Web GIS project built with
            QGIS, GeoJSON and Leaflet.
        </p>

        <div class="divider"></div>

        <div class="locations-header">
            <span>LOCATIONS</span>
            <span id="location-count">0</span>
        </div>

        <div id="location-list" class="location-list">

            <div class="loading">
                Loading locations...
            </div>

        </div>

        <div class="sidebar-footer">
            QGIS · GEOJSON · LEAFLET
        </div>

    </aside>


    <!-- SMALL MAP LABEL -->
    <div class="map-label">
        INDONESIA / WEB GIS
    </div>


    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        /* ==========================================
           INITIALIZE MAP
        ========================================== */

        const map = L.map("map", {
            zoomControl: false
        }).setView(
            [-2.5, 118],
            5
        );


        /* ==========================================
           ZOOM CONTROL
        ========================================== */

        L.control.zoom({
            position: "bottomright"
        }).addTo(map);


        /* ==========================================
           OPENSTREETMAP BASEMAP
        ========================================== */

        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        ).addTo(map);


        /* ==========================================
           READ QGIS FIELD
        ========================================== */

        function getField(properties, fieldName) {

            if (!properties) {
                return "";
            }

            const target =
                fieldName
                    .toLowerCase()
                    .replace(/[\s_-]/g, "");


            const key =
                Object.keys(properties).find(
                    key => {

                        const normalizedKey =
                            key
                                .toLowerCase()
                                .replace(/[\s_-]/g, "");

                        return normalizedKey === target;
                    }
                );


            return key
                ? properties[key]
                : "";
        }


        /* ==========================================
           LOAD GEOJSON
        ========================================== */

        fetch("lokasi.geojson")

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "lokasi.geojson tidak ditemukan."
                    );

                }

                return response.json();
            })


            .then(data => {

                if (
                    !data.features ||
                    !Array.isArray(data.features)
                ) {

                    throw new Error(
                        "Format GeoJSON tidak valid."
                    );
                }


                const locationList =
                    document.getElementById(
                        "location-list"
                    );


                locationList.innerHTML = "";


                /* ==================================
                   LOCATION COUNT
                ================================== */

                document.getElementById(
                    "location-count"
                ).textContent =
                    data.features.length;


                const markers = [];


                /* ==================================
                   LOOP FEATURES
                ================================== */

                data.features.forEach(
                    (feature, index) => {

                        if (
                            !feature.geometry ||
                            feature.geometry.type !== "Point"
                        ) {
                            return;
                        }


                        const coordinates =
                            feature.geometry.coordinates;


                        const longitude =
                            Number(coordinates[0]);


                        const latitude =
                            Number(coordinates[1]);


                        if (
                            !Number.isFinite(latitude) ||
                            !Number.isFinite(longitude)
                        ) {
                            return;
                        }


                        const latlng = [
                            latitude,
                            longitude
                        ];


                        const properties =
                            feature.properties || {};


                        /* ==========================
                           GET DATA
                        ========================== */

                        const nama =
                            getField(
                                properties,
                                "nama"
                            ) ||
                            "Unknown Location";


                        const provinsi =
                            getField(
                                properties,
                                "provinsi"
                            ) ||
                            "Indonesia";


                        const keterangan =
                            getField(
                                properties,
                                "keterangan"
                            ) ||
                            "No description available.";


                        const kategori =
                            getField(
                                properties,
                                "kategori"
                            ) ||
                            "LOCATION";


                        /* ==========================
                           CREATE MARKER
                        ========================== */

                        const marker =
                            L.circleMarker(
                                latlng,
                                {
                                    radius: 8,

                                    color: "#111111",

                                    weight: 3,

                                    fillColor: "#ffffff",

                                    fillOpacity: 1
                                }
                            ).addTo(map);


                        markers.push(marker);


                        /* ==========================
                           LABEL
                        ========================== */

                        marker.bindTooltip(
                            nama,
                            {
                                direction: "top",

                                offset: [
                                    0,
                                    -7
                                ],

                                opacity: 0.95
                            }
                        );


                        /* ==========================
                           POPUP
                        ========================== */

                        const popup = `

                            <div class="popup">

                                <div class="popup-category">
                                    ${kategori}
                                </div>

                                <h2>
                                    ${nama}
                                </h2>

                                <div class="popup-province">
                                    ${provinsi}
                                </div>

                                <div class="popup-divider"></div>

                                <p>
                                    ${keterangan}
                                </p>

                            </div>

                        `;


                        marker.bindPopup(
                            popup,
                            {
                                maxWidth: 280
                            }
                        );


                        /* ==========================
                           SIDEBAR ITEM
                        ========================== */

                        const item =
                            document.createElement(
                                "button"
                            );


                        item.className =
                            "location-item";


                        item.innerHTML = `

                            <span class="location-number">
                                ${String(index + 1).padStart(2, "0")}
                            </span>

                            <span class="location-info">

                                <strong>
                                    ${nama}
                                </strong>

                                <small>
                                    ${provinsi}
                                </small>

                            </span>

                            <span class="location-arrow">
                                ↗
                            </span>

                        `;


                        /* ==========================
                           CLICK SIDEBAR
                        ========================== */

                        item.addEventListener(
                            "click",
                            () => {

                                map.flyTo(
                                    latlng,
                                    10,
                                    {
                                        duration: 1.2
                                    }
                                );


                                setTimeout(
                                    () => {

                                        marker.openPopup();

                                    },
                                    700
                                );

                            }
                        );


                        locationList.appendChild(
                            item
                        );

                    }
                );


                /* ==================================
                   FIT ALL MARKERS
                ================================== */

                if (markers.length > 0) {

                    const group =
                        L.featureGroup(
                            markers
                        );


                    map.fitBounds(
                        group.getBounds(),
                        {
                            padding: [
                                100,
                                100
                            ]
                        }
                    );
                }

            })


            /* ==================================
               ERROR
            ================================== */

            .catch(error => {

                console.error(
                    "GeoJSON error:",
                    error
                );


                document.getElementById(
                    "location-list"
                ).innerHTML = `

                    <div class="error">
                        <strong>
                            Map data error
                        </strong>

                        <p>
                            ${error.message}
                        </p>
                    </div>

                `;
            });

    </script>

</body>

</html>
