<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Indonesia Location Explorer</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- MAP -->
    <div id="map"></div>


    <!-- INFO PANEL -->
    <aside class="info-panel">

        <div class="eyebrow">
            GIS PORTFOLIO
        </div>

        <h1>
            Indonesia
            <span>Location Explorer</span>
        </h1>

        <p class="intro">
            Interactive location mapping project
            created with QGIS, GeoJSON and Leaflet.
        </p>


        <div class="divider"></div>


        <div class="section-title">
            <span>LOCATIONS</span>
            <span id="location-count">0</span>
        </div>


        <div
            id="location-list"
            class="location-list"
        >

            <div class="loading">
                Loading...
            </div>

        </div>


        <div class="footer">
            QGIS&nbsp;&nbsp;·&nbsp;&nbsp;GeoJSON&nbsp;&nbsp;·&nbsp;&nbsp;Leaflet
        </div>

    </aside>


    <!-- MAP LABEL -->
    <div class="map-label">
        INDONESIA / WEB GIS
    </div>


    <!-- LEAFLET JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <script>

        // =====================================================
        // 1. CREATE MAP
        // =====================================================

        const map = L.map("map", {
            zoomControl: false
        }).setView(
            [-2.5, 118],
            5
        );


        // Zoom control
        L.control.zoom({
            position: "bottomright"
        }).addTo(map);


        // =====================================================
        // 2. OPENSTREETMAP
        // =====================================================

        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        ).addTo(map);


        // =====================================================
        // 3. FUNCTION TO READ QGIS FIELD
        // =====================================================

        function getField(properties, wantedName) {

            if (!properties) {
                return "";
            }

            const wanted =
                wantedName
                    .toLowerCase()
                    .replace(/[\s_-]/g, "");


            for (
                const key of Object.keys(properties)
            ) {

                const normalizedKey =
                    key
                        .toLowerCase()
                        .replace(/[\s_-]/g, "");


                if (
                    normalizedKey === wanted
                ) {

                    return properties[key];

                }

            }


            return "";
        }


        // =====================================================
        // 4. SHOW ERROR
        // =====================================================

        function showError(message) {

            const list =
                document.getElementById(
                    "location-list"
                );


            list.innerHTML = `
                <div class="error-box">
                    <strong>Map data error</strong>
                    <p>${message}</p>
                </div>
            `;

        }


        // =====================================================
        // 5. LOAD GEOJSON
        // =====================================================

        fetch("./lokasi.geojson")

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "lokasi.geojson tidak ditemukan. Pastikan file JSON berada satu folder dengan index.html."
                    );

                }

                return response.json();

            })


            .then(data => {

                console.log(
                    "GeoJSON loaded:",
                    data
                );


                // Make sure it's a FeatureCollection
                if (
                    !data ||
                    data.type !== "FeatureCollection"
                ) {

                    throw new Error(
                        "File lokasi.geojson bukan FeatureCollection GeoJSON yang valid."
                    );

                }


                if (
                    !Array.isArray(
                        data.features
                    )
                ) {

                    throw new Error(
                        "GeoJSON tidak memiliki daftar features."
                    );

                }


                // Update count
                document.getElementById(
                    "location-count"
                ).textContent =
                    data.features.length;


                // Remove loading text
                document.getElementById(
                    "location-list"
                ).innerHTML = "";


                // Group for map
                const mapFeatures = [];


                // =================================================
                // LOOP THROUGH FEATURES
                // =================================================

                data.features.forEach(
                    (feature, index) => {

                        if (
                            !feature.geometry ||
                            feature.geometry.type !== "Point" ||
                            !Array.isArray(
                                feature.geometry.coordinates
                            )
                        ) {

                            console.warn(
                                "Feature dilewati karena bukan Point:",
                                feature
                            );

                            return;

                        }


                        const coordinates =
                            feature.geometry.coordinates;


                        const longitude =
                            Number(
                                coordinates[0]
                            );


                        const latitude =
                            Number(
                                coordinates[1]
                            );


                        if (
                            !Number.isFinite(
                                longitude
                            ) ||
                            !Number.isFinite(
                                latitude
                            )
                        ) {

                            console.warn(
                                "Koordinat tidak valid:",
                                feature
                            );

                            return;

                        }


                        // QGIS GeoJSON = [longitude, latitude]
                        const latlng = [
                            latitude,
                            longitude
                        ];


                        const properties =
                            feature.properties || {};


                        // Read fields
                        const nama =
                            getField(
                                properties,
                                "nama"
                            ) ||
                            "Unknown Location";


                        const provinsi =
                            getField(
                                properties,
                                "provinsi"
                            ) ||
                            "Indonesia";


                        const keterangan =
                            getField(
                                properties,
                                "keterangan"
                            ) ||
                            "No description available.";


                        const kategori =
                            getField(
                                properties,
                                "kategori"
                            ) ||
                            "LOCATION";


                        // =================================================
                        // CREATE MARKER
                        // =================================================

                        const marker =
                            L.circleMarker(
                                latlng,
                                {
                                    radius: 8,

                                    color: "#111111",

                                    weight: 3,

                                    fillColor: "#ffffff",

                                    fillOpacity: 1
                                }
                            ).addTo(map);


                        // Small white center effect
                        marker.bindTooltip(
                            nama,
                            {
                                direction: "top",

                                offset: [
                                    0,
                                    -8
                                ],

                                opacity: 0.9
                            }
                        );


                        // =================================================
                        // POPUP
                        // =================================================

                        const popupHTML = `

                            <div class="popup">

                                <div class="popup-category">
                                    ${kategori}
                                </div>

                                <h2>
                                    ${nama}
                                </h2>

                                <div class="popup-province">
                                    ${provinsi}
                                </div>

                                <div class="popup-divider"></div>

                                <p>
                                    ${keterangan}
                                </p>

                            </div>

                        `;


                        marker.bindPopup(
                            popupHTML,
                            {
                                maxWidth: 280
                            }
                        );


                        // Save marker
                        mapFeatures.push(
                            marker
                        );


                        // =================================================
                        // SIDEBAR ITEM
                        // =================================================

                        const item =
                            document.createElement(
                                "button"
                            );


                        item.className =
                            "location-item";


                        item.innerHTML = `

                            <span class="location-number">
                                ${String(index + 1).padStart(2, "0")}
                            </span>

                            <span class="location-info">

                                <strong>
                                    ${nama}
                                </strong>

                                <small>
                                    ${provinsi}
                                </small>

                            </span>

                            <span class="location-arrow">
                                ↗
                            </span>

                        `;


                        item.addEventListener(
                            "click",
                            () => {

                                map.flyTo(
                                    latlng,
                                    10,
                                    {
                                        duration: 1
                                    }
                                );


                                setTimeout(
                                    () => {

                                        marker.openPopup();

                                    },
                                    650
                                );

                            }
                        );


                        document
                            .getElementById(
                                "location-list"
                            )
                            .appendChild(
                                item
                            );

                    }
                );


                // =================================================
                // FIT MAP
                // =================================================

                if (
                    mapFeatures.length > 0
                ) {

                    const group =
                        L.featureGroup(
                            mapFeatures
                        );


                    map.fitBounds(
                        group.getBounds(),
                        {
                            padding: [
                                90,
                                90
                            ]
                        }
                    );

                }
                else {

                    showError(
                        "Tidak ada Point Feature yang valid di lokasi.geojson."
                    );

                }

            })


            .catch(error => {

                console.error(
                    "GeoJSON error:",
                    error
                );


                showError(
                    error.message
                );

            });

    </script>


</body>

</html>
